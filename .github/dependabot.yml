version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore:"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    groups:
      eslint-configs:
        dependency-type: "development"
        patterns:
        - "@freaktechnik/eslint-config*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore:"
    cooldown:
      default-days: 7
